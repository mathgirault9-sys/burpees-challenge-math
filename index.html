<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1000 Burpees Challenge</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg-secondary: #f5f5f3;
      --text: #1a1a18;
      --text-secondary: #888780;
      --border: rgba(0,0,0,0.12);
      --border-hover: rgba(0,0,0,0.25);
      --danger-text: #a32d2d;
      --danger-border: rgba(163,45,45,0.3);
      --danger-bg: #fcebeb;
      --radius: 8px;
      --radius-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a;
        --bg-secondary: #2a2a28;
        --text: #f0ede8;
        --text-secondary: #888780;
        --border: rgba(255,255,255,0.12);
        --border-hover: rgba(255,255,255,0.25);
        --danger-text: #f09595;
        --danger-border: rgba(240,149,149,0.3);
        --danger-bg: rgba(163,45,45,0.15);
      }
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 3rem 1.5rem 4rem;
    }

    .label {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    .big-count {
      font-size: 80px;
      font-weight: 500;
      line-height: 1;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .total {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 6px;
    }

    .progress-section {
      margin: 2rem 0 0.5rem;
    }

    .progress-track {
      height: 5px;
      background: var(--bg-secondary);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--text);
      border-radius: 99px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
    }

    .pct {
      font-size: 12px;
      color: var(--text-secondary);
      text-align: right;
      margin-top: 6px;
    }

    .btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 2rem;
    }

    .btn {
      padding: 14px;
      font-size: 15px;
      font-weight: 500;
      border: 0.5px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover { background: var(--bg-secondary); border-color: var(--border-hover); }
    .btn:active { transform: scale(0.97); }

    .btn-main {
      grid-column: 1 / -1;
      font-size: 18px;
      padding: 20px;
    }

    .btn-danger {
      grid-column: 1 / -1;
      color: var(--danger-text);
      border-color: var(--danger-border);
    }

    .btn-danger:hover { background: var(--danger-bg); }

    .divider {
      border: none;
      border-top: 0.5px solid var(--border);
      margin: 1.75rem 0;
    }

    .toast {
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
      height: 20px;
      margin-top: 1rem;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .done .big-count { opacity: 0.4; }
    .done .progress-fill { background: #639922; }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <p class="label">challenge</p>
    <div class="big-count" id="count">0</div>
    <p class="total">/ 1 000 burpees</p>

    <div class="progress-section">
      <div class="progress-track">
        <div class="progress-fill" id="bar" style="width:0%"></div>
      </div>
      <p class="pct" id="pct">0 %</p>
    </div>

    <div class="btns">
      <button class="btn btn-main" onclick="add(1)">+ 1 burpee</button>
      <button class="btn" onclick="add(5)">+ 5</button>
      <button class="btn" onclick="add(10)">+ 10</button>
      <button class="btn" onclick="add(25)">+ 25</button>
      <button class="btn" onclick="add(50)">+ 50</button>
      <button class="btn" onclick="undo()">annuler</button>
    </div>

    <hr class="divider" />

    <div class="btns">
      <button class="btn btn-danger" onclick="reset()">remettre à zéro</button>
    </div>

    <p class="toast" id="toast"></p>
  </div>

  <script>
    const KEY = 'burpees_v1';
    let total = 0, history = [];

    function load() {
      try {
        const d = JSON.parse(localStorage.getItem(KEY));
        if (d) { total = d.total || 0; history = d.history || []; }
      } catch(e) {}
      render();
    }

    function save() {
      try { localStorage.setItem(KEY, JSON.stringify({ total, history })); } catch(e) {}
    }

    function render() {
      const n = Math.min(total, 1000);
      document.getElementById('count').textContent = total.toLocaleString('fr-FR');
      const pct = Math.round(n / 10);
      document.getElementById('bar').style.width = pct + '%';
      document.getElementById('pct').textContent = pct + ' %';
      document.getElementById('app').classList.toggle('done', total >= 1000);
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.opacity = 1;
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.style.opacity = 0, 2000);
    }

    function add(n) {
      if (total >= 1000) { toast('challenge terminé !'); return; }
      history.push(n);
      total = Math.min(total + n, 1000);
      save(); render();
      if (total === 1000) toast('🎉 challenge complété !');
    }

    function undo() {
      if (!history.length) { toast('rien à annuler'); return; }
      const last = history.pop();
      total = Math.max(total - last, 0);
      save(); render();
      toast('− ' + last + ' annulé');
    }

    function reset() {
      if (!confirm('Remettre le compteur à zéro ?')) return;
      total = 0; history = [];
      save(); render();
      toast('compteur remis à zéro');
    }

    load();
  </script>
</body>
</html>
